name: equipment-service-desk
x-runtime: &runtime
  APP_ENV: dev
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?run make init}
  DATABASE_URL: ${DATABASE_URL:?run make init}
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=false
  COMPOSER_HOME: /tmp/esd-composer
services:
  app:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build: {context: ., dockerfile: docker/Dockerfile, target: development}
    environment: *runtime
    volumes: [".:/app:z"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build: {context: ., dockerfile: docker/Dockerfile, target: development}
    environment: *runtime
    volumes: [".:/app:z"]
    command: ["php", "bin/console", "messenger:consume", "reports", "--time-limit=3600", "--memory-limit=128M", "--no-debug"]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    ports: ["127.0.0.1:${ESD_PORT:-8089}:8080"]
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro,z"]
    depends_on: [app]
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: desk
      POSTGRES_USER: desk_migrator
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?run make init}
      DESK_RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?run make init}
    volumes:
      - "database:/var/lib/postgresql"
      - "./docker/init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro,z"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk_migrator -d desk"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: [tools]
    build: {context: ., dockerfile: docker/Dockerfile, target: development}
    environment:
      <<: *runtime
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?run make init}
    volumes: [".:/app:z"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  database:
