events {}
http {
  log_format safe escape=json '{"event":"proxy_request","status":$status,"method":"$request_method","requestId":"$request_id"}';
  access_log /dev/stdout safe;
  # Native nginx error lines can include raw request URLs. Application logs are redacted separately.
  error_log /dev/null crit;
  limit_req_zone $binary_remote_addr zone=coarse:1m rate=5r/s;
  map $request_id $correlation_id {
    "~^(?<c1>.{8})(?<c2>.{4})(?<c3>.{4})(?<c4>.{4})(?<c5>.{12})$" $c1-$c2-$c3-$c4-$c5;
  }
  server {
    listen 8080;
    server_tokens off;
    root /app/public;
    client_max_body_size 16k;
    limit_req zone=coarse burst=20 nodelay;
    limit_req_status 429;
    error_page 413 = @body_limit;
    error_page 429 = @rate_limit;
    location @body_limit {
      default_type application/problem+json;
      add_header X-Correlation-ID $correlation_id always;
      add_header Cache-Control no-store always;
      return 413 '{"type":"about:blank","title":"Content too large","status":413,"code":"body_too_large","detail":"The request could not be completed.","instance":"urn:uuid:$correlation_id","correlationId":"$correlation_id"}';
    }
    location @rate_limit {
      default_type application/problem+json;
      add_header X-Correlation-ID $correlation_id always;
      add_header Cache-Control no-store always;
      add_header Retry-After 1 always;
      return 429 '{"type":"about:blank","title":"Too many requests","status":429,"code":"rate_limited","detail":"The request could not be completed.","instance":"urn:uuid:$correlation_id","correlationId":"$correlation_id"}';
    }
    location / {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/public/index.php;
      fastcgi_param HTTP_AUTHORIZATION $http_authorization;
      fastcgi_param HTTP_PROXY "";
      fastcgi_pass app:9000;
    }
  }
}
